<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCodeMetrics</title>
    <script src="index.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <div class="heading">LeetCode-Metrics</div>
        <div class="user-container">
            <label for="username">Enter Username : </label>
            <input type="text" id="username" placeholder="abc_123">
            <button type="button" id="search-btn">Search</button>
        </div>
        <div class="stats-container">
            <div class="progress-container">
                <div class="progress-item">
                    <div class="easy-progress circle">
                        <span id="easy-level">

                        </span>
                        Easy
                    </div>

                </div>

                <div class="progress-item">
                    <div class="medium-progress circle">
                        <span id="medium-level">

                        </span>
                        Medium
                    </div>

                </div>
                <div class="progress-item">
                    <div class="hard-progress circle">
                        <span id="hard-level">

                        </span>
                        Hard
                    </div>

                </div>
            </div>
            <div class="stats-card">
                
            </div>
        </div>
        
    </div>
    <div class="footer">
        Note : For Higher Visibility The Grapgh is Multiplied with 1000% instead of 100%
    </div>
</body>

</html>
