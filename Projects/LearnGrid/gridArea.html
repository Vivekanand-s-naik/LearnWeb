<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid-Area</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            width: 100%;
        }
        .container{
            height: 100%;
            width: 100%;
            background-color: cornflowerblue;
            display: grid;
            grid-template-areas: 
                "header header header"
                "sidebar content content"
                "sidebar item item"
                "footer footer footer";
        }
        .item{
            background-color: rgb(137, 0, 139);
            border: 1px solid black;
        }
        #header{
            grid-area: header;
        }
        #content{
            grid-area: content;
        }
        #sidebar{
            grid-area: sidebar;
        }
        #item{
            grid-area: item;
        }
        #footer{
            grid-area: footer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="header"></div>
        <div class="item" id="content"></div>
        <div class="item" id="sidebar"></div>
        <div class="item" id="item"></div>
        <div class="item" id="footer"></div>
    </div>
</body>
</html>
