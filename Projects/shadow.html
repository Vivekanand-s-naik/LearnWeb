<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadow</title>
    <style>
      * {
        box-sizing: border-box;
      }
      .container {
        /* display:flex; */
        /* align-items: center; */
        /* justify-content: center; */
        background-color: aquamarine;
        height: 1000px;
        width: 100%;
      }
      .box1 {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: cornflowerblue;
        border: 3px solid black;
        border-radius: 10000px;
        height: 100px;
        width: 500px;
        position: relative;
        box-shadow:
          inset 3px 5px 1000px violet,
          10px 10px 100px 5px blue;
        animation: 3s linear 2s 19 alternate forwards running circle-movement1;
      }
      @keyframes circle-movement1 {
        from {
          top: 0px;
          left: 0px;
        }
        to {
          top: 0px;
          left: 1100px;
        }
      }
      .box2 {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: cornflowerblue;
        border: 3px solid black;
        border-radius: 10000px;
        height: 100px;
        width: 500px;
        position: relative;
        box-shadow:
          inset 3px 5px 1000px violet,
          10px 10px 100px 5px blue;
        animation: 3s linear 2s 19 alternate both running circle-movement2;
      }
      @keyframes circle-movement2 {
        from {
          top: 250px;
          left: 1000px;
        }
        to {
          top: 250px;
          left: 0px;
        }
      }
      .circle {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        height: 50px;
        width: 50px;
        border-radius: 50px;
        background-color: blueviolet;
        top: -6%;
        left: 50%;
        animation: 5s linear 0s infinite forwards running ball-movement;
      }
      @keyframes ball-movement {
        20% {
          top: 1%;
          left: 5%;
        }
        30% {
          top: 5%;
          left: 90%;
        }
        50% {
          top: -9%;
          left: 10%;
        }
        100% {
          top: -5%;
          left: 90%;
        }
      }
      h3 {
        text-shadow: 3px 3px 5px pink;
      }
      .box3 {
        height: 500px;
        width: 100%;
        background-color: cyan;
      }
      .inner-box{
        height: 300px;
        width: 30%;
        background-color:coral;

        transition-delay: 1s;
        transition-property: all;
        transition-delay: 500ms;
        transition-duration: 3s;
        transition-timing-function: ease-out;
      }
      .inner-box:hover{
        background-color: blueviolet;
        width: 100%;
        height: 50%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box1">
        <h3>Box content</h3>
      </div>
      <div class="box2">
        <h3>Box content</h3>
      </div>
      <div class="circle">*</div>
      <hr />
    </div>
    <div class="box3">
        <div class="inner-box">
           <h5>Hello</h5> 
        </div>
      
    </div>
  </body>
</html>
